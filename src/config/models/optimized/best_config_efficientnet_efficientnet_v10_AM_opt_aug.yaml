augmentation_config:
  use_augmentation: false
callbacks:
- class_path: src.utils.callbacks.EarlyStopping
  init_args:
    patience: 7
    verbose: true
- class_path: src.utils.callbacks.ModelCheckpoint
  init_args:
    filepath: best_model_efficientnet.pth
    monitor: val_loss
    save_best_only: true
global_config:
  batch_size: 48
  data_dir: data/gold/datasets/v9/train_val
  dataset_name: v9
  device: auto
  experiment_name: efficientnet_v10_AM_opt_aug
  max_epochs: 30
  mlflow_uri: file:///mlruns
  num_workers: 0
loss:
  params:
    label_smoothing: 0.1
  type: CrossEntropyLoss
model_type: efficientnet
optimizer:
  params:
    lr: 0.0006117677256761029
    weight_decay: 1.2116734336309682e-05
  type: AdamW
params:
  architecture: efficientnet_b0
  dropout: 0.49023094503961806
  hidden_units: 256
  pretrained: true
  unfreeze_layers: 6
  weights: IMAGENET1K_V1
scheduler:
  params:
    T_0: 11
    T_mult: 2
    eta_min: 1.0e-06
  type: CosineAnnealingWarmRestarts
