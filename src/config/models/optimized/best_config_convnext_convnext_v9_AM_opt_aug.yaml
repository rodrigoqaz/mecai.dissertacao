augmentation_config:
  use_augmentation: false
callbacks:
- class_path: src.utils.callbacks.EarlyStopping
  init_args:
    patience: 7
    verbose: true
- class_path: src.utils.callbacks.ModelCheckpoint
  init_args:
    filepath: best_convnext.pth
    monitor: val_loss
    save_best_only: true
global_config:
  batch_size: 32
  data_dir: data/gold/datasets/v9/train_val
  dataset_name: v9
  device: auto
  experiment_name: convnext_v9_AM_opt_aug
  max_epochs: 30
  mlflow_uri: file:///mlruns
  num_workers: 0
loss:
  params:
    label_smoothing: 0.1176460477916264
  type: CrossEntropyLoss
model_type: convnext
optimizer:
  params:
    lr: 0.00017834830030639533
    weight_decay: 0.00567777594938027
  type: AdamW
params:
  architecture: convnext_small
  dropout: 0.29101286928515935
  hidden_units: 512
  pretrained: true
  unfreeze_layers: 3
  weights: IMAGENET1K_V1
scheduler:
  params:
    factor: 0.22276038498901274
    min_lr: 1.0e-06
    mode: min
    patience: 5
  type: ReduceLROnPlateau
