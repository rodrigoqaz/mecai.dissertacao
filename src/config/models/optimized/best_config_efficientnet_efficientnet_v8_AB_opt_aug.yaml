augmentation_config:
  batch_level_aug_method: mixup
  mix_alpha: 0.9590802120801651
  per_image_aug_method: none
  use_augmentation: true
callbacks:
- class_path: src.utils.callbacks.EarlyStopping
  init_args:
    patience: 7
    verbose: true
- class_path: src.utils.callbacks.ModelCheckpoint
  init_args:
    filepath: best_model_efficientnet.pth
    monitor: val_loss
    save_best_only: true
global_config:
  batch_size: 32
  data_dir: data/gold/datasets/v8/train_val
  dataset_name: v8
  device: auto
  experiment_name: efficientnet_v8_AB_opt_aug
  max_epochs: 30
  mlflow_uri: file:///mlruns
  num_workers: 0
loss:
  params:
    label_smoothing: 0.1
  type: CrossEntropyLoss
model_type: efficientnet
optimizer:
  params:
    lr: 0.000644449815678282
    weight_decay: 1.1481572025657587e-05
  type: Adam
params:
  architecture: efficientnet_b2
  dropout: 0.4378984398607914
  hidden_units: 256
  pretrained: true
  unfreeze_layers: 7
  weights: IMAGENET1K_V1
scheduler:
  params:
    T_0: 7
    T_mult: 2
    eta_min: 1.0e-06
  type: CosineAnnealingWarmRestarts
