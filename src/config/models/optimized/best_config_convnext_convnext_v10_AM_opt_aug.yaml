augmentation_config:
  use_augmentation: false
callbacks:
- class_path: src.utils.callbacks.EarlyStopping
  init_args:
    patience: 7
    verbose: true
- class_path: src.utils.callbacks.ModelCheckpoint
  init_args:
    filepath: best_convnext.pth
    monitor: val_loss
    save_best_only: true
global_config:
  batch_size: 16
  data_dir: data/gold/datasets/v9/train_val
  dataset_name: v9
  device: auto
  experiment_name: convnext_v10_AM_opt_aug
  max_epochs: 30
  mlflow_uri: file:///mlruns
  num_workers: 0
loss:
  params:
    label_smoothing: 0.16625222843539822
  type: CrossEntropyLoss
model_type: convnext
optimizer:
  params:
    lr: 0.00011352525179911179
    weight_decay: 0.03506776499297219
  type: AdamW
params:
  architecture: convnext_tiny
  dropout: 0.34855307303338107
  hidden_units: 512
  pretrained: true
  unfreeze_layers: 5
  weights: IMAGENET1K_V1
scheduler:
  params:
    T_0: 7
    T_mult: 2
    eta_min: 1.0e-06
  type: CosineAnnealingWarmRestarts
