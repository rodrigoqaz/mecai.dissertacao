augmentation_config:
  use_augmentation: false
callbacks:
- class_path: src.utils.callbacks.EarlyStopping
  init_args:
    patience: 15
    verbose: true
- class_path: src.utils.callbacks.ModelCheckpoint
  init_args:
    filepath: best_swin.pth
    monitor: val_loss
    save_best_only: true
global_config:
  batch_size: 32
  data_dir: data/gold/datasets/v8/train_val
  dataset_name: v8
  device: auto
  experiment_name: swin_v8_AB_opt_aug
  max_epochs: 30
  mlflow_uri: file:///mlruns
  num_workers: 0
loss:
  params:
    label_smoothing: 0.0009343988027520796
  type: CrossEntropyLoss
model_type: swin
optimizer:
  params:
    lr: 5.52544593327346e-05
    weight_decay: 0.06745716184161302
  type: AdamW
params:
  architecture: swin_t
  dropout: 0.03013624195776357
  hidden_units: 512
  pretrained: true
  unfreeze_layers: 2
  weights: IMAGENET1K_V1
scheduler:
  params:
    T_0: 14
    T_mult: 2
    eta_min: 1.0e-06
  type: CosineAnnealingWarmRestarts
