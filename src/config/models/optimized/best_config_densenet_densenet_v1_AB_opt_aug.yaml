augmentation_config:
  batch_level_aug_method: cutmix
  mix_alpha: 0.6516917156347651
  per_image_aug_method: none
  use_augmentation: true
callbacks:
- class_path: src.utils.callbacks.EarlyStopping
  init_args:
    patience: 7
    verbose: true
- class_path: src.utils.callbacks.ModelCheckpoint
  init_args:
    filepath: best_densenet.pth
    monitor: val_loss
    save_best_only: true
global_config:
  batch_size: 16
  data_dir: data/gold/datasets/v1/train_val
  dataset_name: v1
  device: auto
  experiment_name: densenet_v1_AB_opt_aug
  max_epochs: 30
  mlflow_uri: file:///mlruns
  num_workers: 0
loss:
  params:
    label_smoothing: 0.1
  type: CrossEntropyLoss
model_type: densenet
optimizer:
  params:
    lr: 0.00015095353478001785
    weight_decay: 0.0009040896735815648
  type: AdamW
params:
  architecture: densenet121
  dropout: 0.20257471438187746
  hidden_units: 512
  pretrained: true
  unfreeze_layers: 2
  weights: IMAGENET1K_V1
scheduler:
  params:
    factor: 0.20360573622512274
    min_lr: 1.0e-06
    mode: min
    patience: 7
  type: ReduceLROnPlateau
