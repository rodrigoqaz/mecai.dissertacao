model_type: "vgg"

params:
  unfreeze_layers: 4
  dropout_rate_1: 0.5
  dropout_rate_2: 0.3
  hidden_units: 256
  weights: "IMAGENET1K_V1"

optimizer: 
  type: "Adam"
  params:
    lr: 0.0001
    weight_decay: 0.00001

scheduler:
  type: "ReduceLROnPlateau"
  params:
    mode: "min"
    patience: 3
    factor: 0.1

loss:
  type: "CrossEntropyLoss"
  params: {}

callbacks:
  - class_path: src.utils.callbacks.EarlyStopping
    init_args:
      patience: 7
      verbose: true

  - class_path: src.utils.callbacks.ModelCheckpoint
    init_args:
      filepath: "best_model.pth"
      monitor: val_loss
      save_best_only: true