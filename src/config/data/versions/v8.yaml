version_name: "v8"
type: "processing"
input_version: "v1"
data_dir: "data/gold/datasets/v8"
input_channels: 15
description: "Dataset baseado na v1 (sem sampling) + Criação de Features com GaborFilter+OtsuThresholding"

processing_steps:
  - type: "feature"
    params:
      method: "threshold+gabor"
      args:
        threshold:
          method: "otsu"
          # block_size: 
          # c: 
        gabor:
          frequencies: [0.05, 0.1, 0.2]
          thetas: [0, 45, 90, 135]
          bandwidth: 0.7

output:
  split:
    test_size: 0.2
    random_state: 42