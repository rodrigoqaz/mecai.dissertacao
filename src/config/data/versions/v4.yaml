version_name: "v4"
type: "processing"
input_version: "v2"
description: "Dataset balanceado com Undersample + Criação de Features com GaborFilter+OtsuThresholding"

processing_steps:
  - type: "feature"
    params:
      method: "threshold+gabor"
      args:
        threshold:
          method: "otsu"
          # block_size: 
          # c: 
        gabor:
          frequencies: [0.05, 0.1, 0.2]
          thetas: [0, 45, 90, 135]
          bandwidth: 0.7

