version_name: "v12"
type: "processing"
input_version: "v10"
data_dir: "data/gold/datasets/v12"
input_channels: 15
description: "Dataset baseado na v10 - br (sem sampling) + Criação de Features com GaborFilter+OtsuThresholding"

processing_steps:
  - type: "feature"
    params:
      method: "threshold+gabor"
      args:
        threshold:
          method: "otsu"
          # block_size: 
          # c: 
        gabor:
          frequencies: [0.05, 0.1, 0.2]
          thetas: [0, 45, 90, 135]
          bandwidth: 0.7

